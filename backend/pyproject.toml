[project]
name = "study-assistant"
version = "0.1.0"
description = "RAG study assistant over private course materials"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "flagembedding>=1.4.2",
    "pinecone>=10.2.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "pymupdf>=2.0",
    "torch>=2.15",
    "typer>=0.27.3",
]

[project.scripts]
study-assistant = "study_assistant.main:cli"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore:builtin type .* has no __module__ attribute:DeprecationWarning"]
markers = [
    "integration: talks to real external services; skipped without credentials",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "TID"]
ignore = [
    "PLR2004",  # magic numbers are fine in tests and thresholds
    "PLR0913",  # adapters take their config as keyword arguments
]

[tool.ruff.lint.isort]
known-first-party = ["study_assistant"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true
untyped_calls_exclude = ["pymupdf"]  # pymupdf.open() is unannotated

[[tool.mypy.overrides]]
module = ["FlagEmbedding.*", "transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "study_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers (dependencies point inward)"
type = "layers"
layers = [
    "study_assistant.main",
    "study_assistant.interfaces",
    "study_assistant.infrastructure",
    "study_assistant.application",
    "study_assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Interfaces call use cases, never adapters"
type = "forbidden"
source_modules = ["study_assistant.interfaces"]
forbidden_modules = ["study_assistant.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of SDKs and frameworks"
type = "forbidden"
source_modules = ["study_assistant.domain", "study_assistant.application"]
forbidden_modules = [
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "typer",
    "boto3",
    "botocore",
    "pinecone",
    "torch",
    "sentence_transformers",
    "FlagEmbedding",
    "fitz",
    "pymupdf",
]

# ---------------------------------------------------------------- uv: CPU-only torch on Linux
# The default Linux torch wheel pulls ~3 GB of CUDA libraries; CI and Docker run on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
