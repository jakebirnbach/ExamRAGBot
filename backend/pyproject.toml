[project]
name = "study-assistant"
version = "0.1.0"
description = "RAG study assistant over private course materials"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.2",
    "pydantic-settings>=2.16.2",
    "typer>=0.27.3",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: talks to real external services; skipped without credentials",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PL", "TID"]
ignore = ["PLR2004"]  # magic numbers are fine in tests and thresholds

[tool.ruff.lint.isort]
known-first-party = ["study_assistant"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "study_assistant"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture layers (dependencies point inward)"
type = "layers"
layers = [
    "study_assistant.main",
    "study_assistant.interfaces",
    "study_assistant.infrastructure",
    "study_assistant.application",
    "study_assistant.domain",
]

[[tool.importlinter.contracts]]
name = "Interfaces call use cases, never adapters"
type = "forbidden"
source_modules = ["study_assistant.interfaces"]
forbidden_modules = ["study_assistant.infrastructure"]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of SDKs and frameworks"
type = "forbidden"
source_modules = ["study_assistant.domain", "study_assistant.application"]
forbidden_modules = [
    "pydantic",
    "pydantic_settings",
    "fastapi",
    "typer",
    "boto3",
    "botocore",
    "pinecone",
    "torch",
    "sentence_transformers",
    "FlagEmbedding",
    "fitz",
    "pymupdf",
]
